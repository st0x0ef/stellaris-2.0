plugins {
    id 'dev.architectury.loom-no-remap' version '1.14-SNAPSHOT' apply false
    id 'architectury-plugin' version '3.5-SNAPSHOT'
    id 'com.gradleup.shadow' version '9.4.2' apply false
}

architectury {
    minecraft = project.minecraft_version
}

allprojects {
    group = rootProject.maven_group
    version = rootProject.mod_version
}

subprojects {
    apply plugin: 'dev.architectury.loom-no-remap'
    apply plugin: 'architectury-plugin'
    apply plugin: 'maven-publish'

    def modLoader = project.name


    base {
        archivesName = "${rootProject.mod_id}-${rootProject.minecraft_version}-${project.name}"
    }

    repositories {
        mavenLocal()
        maven { url "https://maven.exodusstudio.org/releases" }
        maven { url "https://maven.exodusstudio.org/snapshots" }
        maven { url "https://maven.terraformersmc.com/releases" }
        maven { url = "https://maven.blamejared.com/" }
    }

    loom {
        silentMojangMappingsLicense()
    }

    dependencies {
        minecraft "com.mojang:minecraft:${rootProject.minecraft_version}"

        implementation "fr.tathan.exoconfig:exoconfig-$modLoader-${rootProject.minecraft_version}:${rootProject.exoconfig_version}"
        implementation "fr.tathan.sky-aesthetics:sky-aesthetics-$modLoader-${rootProject.minecraft_version}:${rootProject.skyaesthetics_version}"
    }

    java {
        sourceCompatibility = JavaVersion.VERSION_25
        targetCompatibility = JavaVersion.VERSION_25
    }

    tasks.withType(JavaCompile).configureEach {
        it.options.release = 25
    }
}
