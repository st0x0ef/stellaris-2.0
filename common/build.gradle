architectury {
    common(rootProject.enabled_platforms.split(','))
}

loom {
    accessWidenerPath = file('src/main/resources/stellaris.accesswidener')
}

sourceSets {
    lunaVerification {
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
    }
}

tasks.register('verifyHeartOfLunaModel', JavaExec) {
    dependsOn lunaVerificationClasses
    classpath = sourceSets.lunaVerification.runtimeClasspath
    mainClass = 'org.exodusstudio.stellaris.client.renderers.mobs.heartofluna.HeartOfLunaModelVerification'
    workingDir = layout.buildDirectory.dir('luna-verification').get().asFile
    doFirst { workingDir.mkdirs() }
}

check.dependsOn tasks.named('verifyHeartOfLunaModel')

tasks.register('verifyHeartOfLunaCombat', JavaExec) {
    dependsOn lunaVerificationClasses
    classpath = sourceSets.lunaVerification.runtimeClasspath
    mainClass = 'org.exodusstudio.stellaris.client.renderers.mobs.heartofluna.HeartOfLunaCombatVerification'
    workingDir = layout.buildDirectory.dir('luna-verification').get().asFile
    doFirst { workingDir.mkdirs() }
}

check.dependsOn tasks.named('verifyHeartOfLunaCombat')

dependencies {
    implementation "net.fabricmc:fabric-loader:$rootProject.fabric_loader_version"
    implementation "com.fej1fun.potentials:potentials-common-$rootProject.minecraft_version:$rootProject.potentials_version"
    implementation "dev.architectury:architectury:$rootProject.architectury_api_version"

    compileOnly "mezz.jei:jei-$rootProject.minecraft_version-common-api:$rootProject.jei_version"
    runtimeOnly "mezz.jei:jei-$rootProject.minecraft_version-common:$rootProject.jei_version"

    // Jade has no common module; the API is identical across platforms, so compile against one jar.
    compileOnly "maven.modrinth:jade:${rootProject.jade_version}+neoforge"
}
