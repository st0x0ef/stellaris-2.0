architectury {
    platformSetupLoomIde()
    fabric()
}

loom {
    accessWidenerPath = project(':common').loom.accessWidenerPath
    injectAccessWidener(tasks.named('jar'))
}

configurations {
    developmentFabric.extendsFrom common
}

sourceSets {
    main {
        resources.srcDir project(':common').file('src/main/generated/resources').absolutePath
    }
}

dependencies {
    implementation "net.fabricmc:fabric-loader:$rootProject.fabric_loader_version"
    implementation "net.fabricmc.fabric-api:fabric-api:$rootProject.fabric_api_version+$rootProject.minecraft_version"
    implementation "com.fej1fun.potentials:potentials-fabric-$rootProject.minecraft_version:$rootProject.potentials_version"
    implementation "dev.architectury:architectury-fabric:$rootProject.architectury_api_version"

    api "com.terraformersmc:modmenu:$rootProject.modmenu_version"

    compileOnly "mezz.jei:jei-$rootProject.minecraft_version-fabric-api:$rootProject.jei_version"
    runtimeOnly "mezz.jei:jei-$rootProject.minecraft_version-fabric:$rootProject.jei_version"

    runtimeOnly "maven.modrinth:jade:${rootProject.jade_version}+fabric"

    common(project(path: ':common')) { transitive = false }
    shadowCommon(project(path: ':common', configuration: 'transformProductionFabric')) { transitive = false }
}

processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') {
        expand version: project.version
    }
}

shadowJar {
    exclude 'architectury.common.json'
}
